name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff pytest pandas nba_api sqlalchemy psycopg2-binary python-dotenv
      - run: ruff check ingestion
      - run: pytest -q --no-header || test $? -eq 5   # exit 5 = no tests collected yet
