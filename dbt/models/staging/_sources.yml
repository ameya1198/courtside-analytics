version: 2

# Sources tell dbt which tables already exist in the database (our loader made them).
# Models read from them with {{ source('raw', 'table_name') }}.
sources:
  - name: raw
    schema: raw
    description: Tables loaded straight from the NBA API by the Python loader.
    config:
      loaded_at_field: loaded_at
      # Freshness check. Run with: dbt source freshness
      # In the offseason no new rows arrive, so expect a warning until games start.
      freshness:
        warn_after: {count: 2, period: day}
        error_after: {count: 7, period: day}
    tables:
      - name: teams
        description: The 30 current NBA teams.
        config:
          freshness: null   # a static list, no freshness check
      - name: players
        description: Every player in NBA history.
        config:
          freshness: null
      - name: player_game_logs
        description: One row per player per game, regular season and playoffs.
      - name: team_game_logs
        description: One row per team per game, regular season and playoffs.
      - name: shots
        description: One row per shot attempt (made or missed), with court position and zone.
      - name: team_clutch
        description: Team totals in clutch time (last 5 minutes, score within 5), per season type.
      - name: player_clutch
        description: Player totals in clutch time, per season type.
      - name: player_bio
        description: Player age, size and draft details per season.
      - name: player_on_off
        description: Team ratings with each player on and off the court (TeamPlayerOnOffSummary), 2024-25 onward.
      - name: player_defended_shots
        description: Opponent shooting when each player was the closest defender, by shot category (LeagueDashPtDefend).
      - name: player_hustle
        description: Player hustle totals per season (LeagueHustleStatsPlayer).
      - name: player_advanced
        description: Win Shares, Box Plus/Minus and VORP from Basketball-Reference team pages, per player x team x season.
        config:
          freshness: null   # refreshed with salaries, a few times a year
      - name: team_defense_misc
        description: Points each team allows per game off turnovers, second chances, fast breaks and in the paint.
      - name: schedule
        description: Every scheduled game of a season, including games not played yet.
        config:
          freshness: null   # loaded once and refreshed nightly in season
      - name: salaries
        description: Player salaries scraped from Basketball-Reference, matched to NBA player ids by name.
        config:
          freshness: null   # refreshed a few times a year
