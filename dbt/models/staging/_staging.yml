version: 2

models:
  - name: stg_nba__teams
    description: One row per NBA team, with clean column names.
    columns:
      - name: team_id
        description: NBA's ID for the team.
        data_tests:
          - unique
          - not_null

  - name: stg_nba__players
    description: One row per player in NBA history, with clean column names.
    columns:
      - name: player_id
        description: NBA's ID for the player.
        data_tests:
          - unique
          - not_null

  - name: stg_nba__player_game_logs
    description: One row per player per game, regular season and playoffs.
    columns:
      - name: game_id
        description: NBA's ID for the game.
        data_tests:
          - not_null
      - name: player_id
        description: NBA's ID for the player.
        data_tests:
          - not_null
      - name: team_id
        description: NBA's ID for the player's team in this game.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nba__teams')
                field: team_id
      - name: season_type
        description: Regular Season or Playoffs.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Regular Season', 'Playoffs']

  - name: stg_nba__team_game_logs
    description: One row per team per game, regular season and playoffs.
    columns:
      - name: game_id
        description: NBA's ID for the game.
        data_tests:
          - not_null
      - name: team_id
        description: NBA's ID for the team.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nba__teams')
                field: team_id
      - name: season_type
        description: Regular Season or Playoffs.
        data_tests:
          - accepted_values:
              arguments:
                values: ['Regular Season', 'Playoffs']

  - name: stg_nba__shots
    description: One row per shot attempt (made or missed), with clean column names.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_id, game_event_id]
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: player_id
        data_tests:
          - not_null
      - name: is_made
        description: True when the shot went in.
        data_tests:
          - not_null
      - name: shot_zone_basic
        description: Broad court zone, such as Restricted Area, Mid-Range or Above the Break 3.
        data_tests:
          - not_null
      - name: shot_distance
        description: Distance from the basket in feet.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: loc_x
        description: Sideways court position in tenths of a foot. 0 is straight in front of the hoop.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -250
                max_value: 250
