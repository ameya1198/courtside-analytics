# The connection dbt uses. Passwords come from environment variables, never from this file,
# so it is safe to commit. Load them first with:  set -a; source ../.env; set +a
courtside:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('SUPABASE_DB_HOST') }}"
      port: "{{ env_var('SUPABASE_DB_PORT', '5432') | as_number }}"
      user: "{{ env_var('SUPABASE_DB_USER') }}"
      password: "{{ env_var('SUPABASE_DB_PASSWORD') }}"
      dbname: "{{ env_var('SUPABASE_DB_NAME', 'postgres') }}"
      schema: staging   # default schema if a model does not pick one
      threads: 4
